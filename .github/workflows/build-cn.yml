name: Build Chinese UnityModManager

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore UnityModManager.sln

      - name: Build Release
        run: dotnet build UnityModManagerApp/UnityModManagerApp.csproj --configuration Release --no-restore --verbosity minimal

      - name: Collect distributable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item UnityModManagerApp/bin/Release/* artifact -Recurse -Force
          if (-not (Test-Path artifact/UnityModManager.exe)) {
            throw 'UnityModManager.exe was not produced by the build.'
          }
          Compress-Archive -Path artifact/* -DestinationPath UnityModManager-Chinese.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityModManager-Chinese
          path: |
            UnityModManager-Chinese.zip
            artifact/UnityModManager.exe
            artifact/**/*.dll
            artifact/**/*.xml
          if-no-files-found: error
